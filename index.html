<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obras JACOMAR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Layout: barra fixa com a escolha da obra; carteira de obras como página inicial; cada obra abre em custos (target, centros de custo, notas por mês), avanço físico quando houver etapas, e pendências. */
:root {
  --bg: #0b0b0b;
  --panel: #171717;
  --fg: #ffffff;
  --muted: #b3b3b3;
  --line: #333333;
  --grid: #262626;
  --accent: #ffed00;
  --accent-soft: #3a3600;
  --plan: #8a8a8a;
  --fin: #6fb0d2;
  --ok: #5cc98a;
  --warn: #ffb547;
  --bad: #ff4d52;
  --brand-red: #e31e24;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --r: 8px;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0b0b0b; --panel: #171717; --fg: #ffffff; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0b0b0b; --panel: #171717; --fg: #ffffff; color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1200px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px; }
.brand { font-family: var(--display); font-weight: 600; font-size: 20px; letter-spacing: .02em; text-transform: uppercase; background: none; border: 0; color: var(--fg); cursor: pointer; padding: 0; }
.brand { display: inline-flex; align-items: center; gap: 10px; }
.brand img { display: block; height: 40px; width: auto; }
.brand span { color: var(--accent); }
.bar { border-bottom: 3px solid var(--accent); background: #000; }
select, input, button { font: inherit; color: inherit; }
select, input[type="text"], input[type="date"], input[type="number"], input[type="month"] { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }
button { cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
button.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
button.ghost { background: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { padding-block: 24px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(28px, 4vw, 40px); line-height: 1.05; }
h2 { font-size: 17px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.head { display: grid; gap: 6px; }
.head .row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; border: 1px solid currentColor; border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
.tag.bad { color: var(--bad); } .tag.warn { color: var(--warn); } .tag.ok { color: var(--ok); } .tag.muted { color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 175px), 1fr)); gap: 12px; }
.kpi .lbl { font-size: 13px; color: var(--muted); }
.kpi .big { font-family: var(--display); font-weight: 600; font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.kpi .sub b { color: var(--fg); font-weight: 600; }
.meter { position: relative; height: 8px; background: var(--grid); border-radius: 4px; }
.meter i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--accent); max-width: 100%; }
.meter s { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); }
.c-bad { color: var(--bad); } .c-ok { color: var(--ok); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 12px; }
.chart { position: relative; min-height: 240px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { font-family: var(--body); font-size: 12px; fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
.legend i.line { height: 0; width: 16px; border-top: 2px solid; border-radius: 0; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.5); white-space: nowrap; font-variant-numeric: tabular-nums; z-index: 2; }
.tip .d { color: var(--muted); }
.cardhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font-size: 13px; padding: 3px 11px; border-radius: 999px; color: var(--muted); background: transparent; }
.chips button[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }
.tbox { overflow-x: auto; }
.tbox.tall { max-height: 34rem; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--panel); }
td { padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
td.num, th.num { text-align: right; white-space: nowrap; }
tr.grp td { font-weight: 600; background: var(--bg); }
tr.tot td { font-weight: 600; border-top: 1px solid var(--line); }
tr.neg td { color: var(--muted); }
tr.late td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
td input { width: 100%; }
td input[type="number"] { width: 7em; text-align: right; }
td input.money { width: 9.5em; }
td input[type="date"] { width: 9.5em; }
td input.name { min-width: 13em; }
.hb { display: grid; grid-template-columns: minmax(70px, 1fr) 5.2em; gap: 8px; align-items: center; min-width: 170px; }
.hb .meter { height: 10px; background: transparent; }
.hb .meter i { border-radius: 3px; }
.cellbar { display: grid; grid-template-columns: 3.4em minmax(70px, 1fr); gap: 8px; align-items: center; min-width: 150px; }
.cellbar .meter { height: 6px; }
.detail { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.portfolio { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.ob { text-align: left; display: grid; gap: 12px; padding: 18px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); }
.ob:hover { border-color: var(--accent); }
.ob .t { font-family: var(--display); font-size: 24px; font-weight: 600; line-height: 1.1; }
.ob .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; font-size: 13px; color: var(--muted); }
.ob .stats b { display: block; font-family: var(--display); font-size: 24px; color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.ob .stats b.c-bad { color: var(--bad); }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.form label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.check { display: flex; gap: 8px; align-items: center; color: var(--fg); font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.editbar { position: sticky; bottom: env(safe-area-inset-bottom, 0px); background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--r); padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; z-index: 3; }
.editbar .sp { flex: 1; }
.msg { font-size: 13px; color: var(--muted); }
.msg.err { color: var(--bad); }
.empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }
.pend-late { color: var(--bad); font-weight: 500; }
.card > *, main > * > * { min-width: 0; }
td span.pend-late, td.nowrap { white-space: nowrap; }
.prazo { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 24px; align-items: center; border-left: 4px solid var(--ok); }
.prazo.late { border-left-color: var(--bad); }
@media (max-width: 760px) { .prazo { grid-template-columns: minmax(0, 1fr); } }
.prazo-left, .prazo-right { display: grid; gap: 12px; min-width: 0; }
.area { display: inline-flex; justify-self: start; width: fit-content; align-items: baseline; gap: 8px; margin: 2px 0 4px; padding: 6px 14px; border-radius: 6px; background: var(--accent); color: var(--bg); }
.area b { font-family: var(--display); font-size: 34px; font-weight: 700; line-height: 1.1; }
.area span { font-size: 14px; }
.prazo.done { border-left-color: var(--ok); grid-template-columns: minmax(0, 1fr); }
.prazo.done .cv { color: var(--ok); }
.prazo.done .clock { grid-template-columns: auto; justify-content: start; }
.prazo.done .cu { padding: 8px 16px; }
.clock-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.clock-title { font-size: 14px; color: var(--muted); }
.clock { display: grid; grid-template-columns: repeat(4, minmax(0, 88px)); gap: 10px; }
.cu { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 4px; min-width: 0; text-align: center; }
.cv { font-family: var(--display); font-weight: 600; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.prazo.late .cv { color: var(--bad); }
.cl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.cmp { display: grid; gap: 6px; }
.cmp-l { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.cmp-l b { font-variant-numeric: tabular-nums; }
.ob .when { font-size: 13px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { flex: none; border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: transparent; padding: 10px 14px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tabs button[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }
.sortbtn { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
th.num .sortbtn { text-align: right; }
td.wide { min-width: 15em; }
.filters select { max-width: 100%; }
.sources { overflow-wrap: anywhere; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
@media (max-width: 640px) { .hide-sm { display: none; } .kpi .big { font-size: 32px; } }
.setup-erro { max-width: 640px; margin: 40px auto; display: grid; gap: 10px; border-left: 4px solid var(--bad); }
.setup-erro h2 { margin: 0; }
.setup-erro p { margin: 0; }
.setup-code { margin: 0; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
#sb-aviso { margin-top: 16px; }
#sb-aviso .sb-aviso-txt { padding: 10px 14px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--r); color: var(--fg); font-size: 14px; }
.login { max-width: 380px; margin: 40px auto; display: grid; gap: 12px; }
.login h2 { margin: 0; }
.login label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
</style>

<script>
(() => {
  const app = document.getElementById('app');
  const pick = document.getElementById('pick');
  const newBtn = document.getElementById('newBtn');
  const editBtn = document.getElementById('editBtn');
  let db = null, canWrite = false;
  let obras = new Map();
  let current = null, mode = 'view', draft = null;
  let fEtapas = 'todas', fPend = 'abertas';
  let msg = { text: '', err: false };
  let confirmDel = false;

  // ---------- helpers ----------
  const DAY = 86400000;
  const today = () => { const d = new Date(); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()); };
  const ms = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : NaN; };
  const iso = (t) => new Date(t).toISOString().slice(0, 10);
  const monthKey = (t) => new Date(t).toISOString().slice(0, 7);
  const n = (x) => { const v = Number(x); return isFinite(v) ? v : 0; };
  const sum = (arr, f) => (arr || []).reduce((s, x) => s + f(x), 0);
  const pct = (v) => (v == null || !isFinite(v)) ? '—' : (Math.round(v * 10) / 10).toLocaleString('pt-BR') + '%';
  const brl = (v) => { v = n(v); const big = Math.abs(v) >= 1e6; return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', notation: big ? 'compact' : 'standard', maximumFractionDigits: big ? 2 : 0 }).format(v); };
  const brlFull = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(n(v));
  const dt = (s) => { const t = ms(s); return isNaN(t) ? '—' : new Date(t).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: '2-digit', timeZone: 'UTC' }).replace(/\./g, ''); };
  const mStart = (k) => { const m = /^(\d{4})-(\d{2})/.exec(k || ''); return m ? Date.UTC(+m[1], +m[2] - 1, 1) : NaN; };
  const mlabel = (t) => new Date(t).toLocaleDateString('pt-BR', { month: 'short', timeZone: 'UTC' }).replace('.', '') + '/' + String(new Date(t).getUTCFullYear()).slice(2);
  const signed = (v) => v == null || !isFinite(v) ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + (Math.round(Math.abs(v) * 10) / 10).toLocaleString('pt-BR');
  const slug = (s) => (s || 'obra').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'obra';
  const uid = () => Math.random().toString(36).slice(2, 9);
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'text') el.textContent = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
    return el;
  };
  const NS = 'http://www.w3.org/2000/svg';
  const s = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const stxt = (a, t) => { const e = s('text', a); e.textContent = t; return e; };

  // ---------- calculations ----------
  const prevPct = (e, t) => {
    const a = ms(e.inicio), b = ms(e.termino);
    if (isNaN(a) || isNaN(b)) return null;
    if (t <= a) return 0; if (t >= b) return 100;
    return (t - a) / (b - a) * 100;
  };
  const situacao = (e, t) => {
    const p = prevPct(e, t), r = n(e.realizado);
    if (r >= 100) return 'Concluída';
    if (p != null && (r < p - 5 || (t > ms(e.termino) && r < 100))) return 'Atrasada';
    if (r === 0 && !p) return 'Não iniciada';
    return 'Em andamento';
  };
  const grupoDe = (c) => c.grupo || 'Obra';
  function fisico(o, t = today()) {

  function editBar() {

      h('strong', { text: 'Atualizando dados' }), h('span', { class: 'msg' + (msg.err ? ' err' : ''), text: msg.text || 'As mudanças só valem depois de salvar.' }), h('span', { class: 'sp' }),
      confirmDel ? h('button', { type: 'button', class: 'danger', onclick: deleteObra, text: 'Confirmar exclusão da obra' }) : h('button', { type: 'button', class: 'danger', onclick: () => { confirmDel = true; render(); }, text: 'Excluir obra' }),
      h('button', { type: 'button', onclick: cancelEdit, text: 'Cancelar' }),
      h('button', { type: 'button', class: 'primary', onclick: save, text: 'Salvar' }));
  }

  // ---------- new obra ----------
  // Modelo de centros de custo e participação de cada um no custo da obra (estrutura do controle de custos da Borda do Campo, sem terreno e estoque).
  const CENTROS_PADRAO = [
    ['Projetos', 'Obra', .4], ['Serviços iniciais / canteiro / locações / documentos', 'Obra', 5.2], ['Terraplanagem + pavimentação', 'Obra', 10.2], ['Fundação', 'Obra', 6.1],
    ['Superestrutura / cobertura', 'Obra', 31.6], ['Piso de concreto', 'Obra', 4.3], ['Impermeabilização', 'Obra', 1], ['Instalações hidráulicas', 'Obra', 5.5],
    ['Instalações de incêndio', 'Obra', .8], ['Instalações elétricas', 'Obra', 5.8], ['Vedações / fechamentos / forros', 'Obra', 3.1], ['Esquadrias', 'Obra', 1.2],
    ['Revestimentos', 'Obra', 4], ['Pintura', 'Obra', 1], ['Serralheria', 'Obra', 1.6], ['ADM e gerenciamento de obras', 'Obra', 5], ['Mão de obra terceirizados', 'Obra', 5.1],
    ['Contrapartidas', 'Obra', 4.9], ['Climatização ADM', 'Obra', .7], ['Climatização loja', 'Obra', 2], ['Elevador', 'Obra', .5], ['Terreno', 'Obra', 0],
    ['Mobiliário salão de vendas', 'Operação', 0], ['Comunicação visual', 'Operação', 0], ['Inox setores', 'Operação', 0], ['Refrigeração / gôndolas / porta-paletes', 'Operação', 0],
    ['Equipamentos padaria / rotisseria', 'Operação', 0], ['Equipamentos açougue / frios', 'Operação', 0], ['Gerador', 'Operação', 0], ['TI / infra / equipamentos', 'Operação', 0],
    ['CFTV / alarme', 'Operação', 0], ['Marketing', 'Operação', 0], ['Estoque', 'Operação', 0]];
  const ETAPAS_PADRAO = [['Serviços preliminares', 0, .08, 3], ['Terraplanagem', .03, .15, 8], ['Fundações', .08, .25, 10], ['Estrutura e cobertura', .2, .55, 30], ['Piso de concreto', .45, .6, 5],
    ['Instalações', .4, .85, 14], ['Vedações e fechamentos', .45, .7, 8], ['Revestimentos e pintura', .65, .9, 9], ['Esquadrias e serralheria', .7, .9, 5], ['Pavimentação externa', .8, .97, 5], ['Limpeza e entrega', .95, 1, 3]];
  let nf = null;
  function startNew() { nf = { nome: '', local: '', responsavel: '', inicio: iso(today()), termino: iso(today() + 365 * DAY), target: '', padrao: true }; mode = 'new'; msg = { text: '', err: false }; render(); }
  function renderNew() {
    const f = (label, key, type = 'text', extra = {}) => h('label', {}, label, h('input', { type, id: 'n-' + key, value: nf[key], ...extra, oninput: (e) => { nf[key] = e.target.value; } }));
    app.append(h('div', { class: 'head' }, h('div', { class: 'eyebrow', text: 'Cadastro' }), h('h1', { text: 'Nova obra' })),
      h('section', { class: 'card' },
        h('div', { class: 'form' }, f('Nome da obra', 'nome', 'text', { placeholder: 'Ex.: Supermercado Pinheirinho' }), f('Local', 'local', 'text', { placeholder: 'Ex.: Pinheirinho, Curitiba' }), f('Responsável', 'responsavel'),
          f('Início da obra', 'inicio', 'date'), f('Término previsto', 'termino', 'date'), f('Target da obra (R$)', 'target', 'number', { min: 0, step: 'any' })),
        h('label', { class: 'check' }, h('input', { type: 'checkbox', id: 'n-padrao', checked: nf.padrao, onchange: (e) => { nf.padrao = e.target.checked; } }), 'Começar com os centros de custo e etapas padrão (o target é distribuído pela participação de cada centro na Borda do Campo; ajuste depois)'),
        h('div', { class: 'actions' }, h('button', { type: 'button', class: 'primary', onclick: createObra, text: 'Criar obra' }), h('button', { type: 'button', onclick: () => { mode = 'view'; render(); }, text: 'Cancelar' }), h('span', { class: 'msg' + (msg.err ? ' err' : ''), text: msg.text }))));
  }
  async function createObra() {
    const nome = nf.nome.trim();
    if (!nome) { msg = { text: 'Informe o nome da obra.', err: true }; return render(); }
    const a = ms(nf.inicio), b = ms(nf.termino);
    if (isNaN(a) || isNaN(b) || b <= a) { msg = { text: 'O término precisa ser depois do início.', err: true }; return render(); }
    let id = slug(nome); while (obras.has(id)) id = slug(nome) + '-' + uid().slice(0, 3);
    const tgt = n(nf.target), shareTot = sum(CENTROS_PADRAO, (x) => x[2]);
    const doc = {
      nome, local: nf.local.trim(), responsavel: nf.responsavel.trim(), target: tgt || null,
      centros: nf.padrao ? CENTROS_PADRAO.map(([nm, g, sh]) => ({ id: uid(), nome: nm, grupo: g, valor: Math.round(tgt * sh / shareTot) })) : [],
      etapas: nf.padrao ? ETAPAS_PADRAO.map(([nm, s0, e0, peso]) => ({ id: uid(), nome: nm, inicio: iso(a + (b - a) * s0), termino: iso(a + (b - a) * e0), peso, realizado: 0 })) : [],
      mensal: [], categorias: [], pendencias: [], historico: [], criado_em: new Date().toISOString(), atualizado_em: new Date().toISOString(),
    };
    try { await db.collection('obras').doc(id).set(doc); obras.set(id, doc); mode = 'view'; go(id); }
    catch (e) { msg = { text: errText(e), err: true }; render(); }
  }

  // ---------- edit / save ----------
  function startEdit() { draft = structuredClone(obras.get(current)); mode = 'edit'; confirmDel = false; msg = { text: '', err: false }; render(); }
  function cancelEdit() { draft = null; mode = 'view'; confirmDel = false; render(); }
  const errText = (e) => e && e.code === 'invalid_argument' ? 'Você não tem permissão para alterar os dados desta página.' : e && e.code === 'quota_exceeded' ? 'O espaço de dados desta página está cheio.' : (e && e.message) || 'Não foi possível salvar agora. Tente de novo.';
  async function save() {
    if (!draft.nome || !String(draft.nome).trim()) { msg = { text: 'Informe o nome da obra.', err: true }; return render(); }
    for (const e of draft.etapas || []) for (const k of ['peso', 'realizado']) e[k] = n(e[k]);
    for (const x of draft.centros || []) x.valor = n(x.valor);
    for (const x of draft.categorias || []) x.valor = n(x.valor);
    for (const x of draft.mensal || []) { x.lancado = n(x.lancado); x.pago = n(x.pago); }
    draft.mensal = (draft.mensal || []).sort((a, b) => String(a.mes).localeCompare(String(b.mes)));
    draft.target = n(draft.target) || null;
    const blankOr = (v) => v === '' || v == null ? '' : n(v);
    draft.curva_fisica = (draft.curva_fisica || []).filter((x) => x.mes).map((x) => ({ mes: x.mes, previsto: blankOr(x.previsto), realizado: blankOr(x.realizado) })).sort((a, b) => a.mes.localeCompare(b.mes));
    for (const x of draft.orcado_realizado || []) { x.orcado = n(x.orcado); x.realizado = n(x.realizado); }
    for (const x of draft.atividades || []) { x.concluido = blankOr(x.concluido); x.meta = blankOr(x.meta); }
    for (const x of draft.mao_obra || []) { x.qtde = n(x.qtde); x.unitario = n(x.unitario); }
    if ((draft.etapas || []).length && !draft.curva_fisica.length) {
      const key = monthKey(today());
      draft.historico = (draft.historico || []).filter((x) => x.mes !== key).concat({ mes: key, fisico: Math.round(fisico(draft).fr * 10) / 10 }).sort((a, b) => a.mes.localeCompare(b.mes));
    }
    draft.atualizado_em = new Date().toISOString();
    msg = { text: 'Salvando…', err: false }; render();
    try { await db.collection('obras').doc(current).set(draft); obras.set(current, draft); draft = null; mode = 'view'; msg = { text: '', err: false }; render(); }
    catch (e) { msg = { text: errText(e), err: true }; render(); }
  }
  async function deleteObra() {
    try { await db.collection('obras').doc(current).delete(); obras.delete(current); draft = null; mode = 'view'; confirmDel = false; go(null); }
    catch (e) { msg = { text: errText(e), err: true }; render(); }
  }

  // ---------- navigation ----------
  function go(id) {
    current = id && obras.has(id) ? id : null;
    try { history.replaceState(null, '', current ? '#' + current : location.pathname + location.search); } catch {}
    render(); window.scrollTo(0, 0);
  }
  pick.addEventListener('change', () => go(pick.value || null));
  document.getElementById('home').addEventListener('click', () => { if (mode === 'view' && db && obras.size) go(null); });
  newBtn.addEventListener('click', startNew);
  editBtn.addEventListener('click', startEdit);
  let rz, lastW = window.innerWidth;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (current && mode === 'view' && window.innerWidth !== lastW) { lastW = window.innerWidth; render(); } }, 200); });

  // ---------- boot ----------
  (async () => {
    db = window.claude ? await window.claude.use('db') : null;
    const user = window.claude ? await window.claude.use('user') : null;
    if (user) { try { canWrite = (await user.can('data.write')) !== false; } catch { canWrite = true; } } else canWrite = !!db;
    if (!db) {
      canWrite = false;
      if (!window.claude) {
        pick.closest('label').style.visibility = 'hidden';
        app.replaceChildren(h('section', { class: 'card setup-erro', role: 'alert' },
          h('h2', { text: window.__shimFaltando ? 'O arquivo supabase-shim.js não foi encontrado' : 'O arquivo supabase-shim.js não carregou' }),
          h('p', { text: 'É ele que liga a página ao Supabase e mostra a tela de login. Envie para o GitHub o supabase-shim.js deste pacote, na mesma pasta do index.html e do config.js, com esse nome exato (tudo minúsculo). Envie sempre o index.html e o supabase-shim.js juntos, e espere o Vercel terminar de publicar.' })));
        return;
      }
      render(); return;
    }
    const wanted = location.hash.slice(1);
    let first = true;
    db.collection('obras').onSnapshot((snap) => {
      obras = new Map(snap.docs.map((d) => [d.id, d.data()]));
      if (first) { first = false; if (wanted && obras.has(wanted)) current = wanted; }
      if (current && !obras.has(current) && mode === 'view') current = null;
      if (mode !== 'view') { renderBar(); return; }
      render();
    }, () => { if (!obras.size) app.replaceChildren(h('div', { class: 'empty', text: 'Não foi possível carregar as obras. Recarregue a página.' })); });
  })();
})();
</script>
